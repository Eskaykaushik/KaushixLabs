<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kaushix Labs | Research • Training • Consultancy</title>

    <meta name="description"
        content="Kaushix Labs provides AI Research, Industry Training and Technology Consultancy.">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <script>
    document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("theme") || "dark"
    );
</script>

</head>

<body>

    <!-- ==========================================
        Navigation
    =========================================== -->

    <header>

        <div class="container navbar">

            <a href="index.html" class="logo">

                <span class="green">$</span> Kaushix Labs

            </a>

            <nav>



                <a href="research.html">Research</a>





                <a href="about.html">About</a>

                <a href="contact.html">Contact</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    ☾
                </button>

            </nav>

        </div>

    </header>

    <!-- ==========================================
        Hero
    =========================================== -->

    <section class="hero">

        <div class="container hero-grid">

            <div class="terminal">

                <div class="terminal-top">

                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green-dot"></span>

                    <div class="terminal-title">

                        kaushix@labs:~

                    </div>

                </div>

                <div class="terminal-body">

                    <p>

                        <span class="green">$</span>

                        <span id="command"></span>

                        <span class="cursor">█</span>

                    </p>

                    <div id="terminal-output"></div>

                </div>

            </div>

            <div class="hero-content">

                <p class="tag">

                    RESEARCH • TRAINING • CONSULTANCY

                </p>

               <h1>
                Research. Built for Impact.
            </h1>

                <p>

                    Kaushix Labs helps organizations innovate through
                    cutting-edge AI research, industry-focused training,
                    and enterprise technology consulting.

                </p>

                <div class="buttons">

                    <a href="research.html" class="btn primary">

                        Explore Research

                    </a>

                    <a href="contact.html" class="btn secondary">

                        Get in Touch

                    </a>

                </div>

            </div>

        </div>

    </section>

    <script src="js/script.js"></script>

</body>

</html>
