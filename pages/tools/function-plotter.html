<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Function Plotter | Kaushix Labs Tools</title>

    <meta name="description" content="Interactive graph of y = f(x) with zoom and pan. A lightweight scientific tool from Kaushix Labs.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/tools.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script>
        document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("theme") || "dark"
        );
    </script>

    <style>
        .plot-canvas-wrap {
            padding: 1rem 1.3rem 1.2rem;
        }

        .plot-canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 440px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #010409;
            cursor: grab;
            touch-action: none;
        }

        .plot-canvas-wrap canvas:active {
            cursor: grabbing;
        }

        .plot-readout {
            display: flex;
            justify-content: space-between;
            gap: .8rem;
            flex-wrap: wrap;
            margin-top: .6rem;
            font-family: "JetBrains Mono", monospace;
            font-size: .72rem;
            color: var(--muted);
        }

        @media (max-width: 600px) {
            .plot-canvas-wrap canvas {
                height: 320px;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="container navbar">

            <a href="../../index.html" class="logo">
                <span class="green">$</span> Kaushix Labs
            </a>

            <nav>
                <a href="../../research.html">Research</a>
                <a href="../../team.html">Our Team</a>
                <a href="../../clients.html">Clients</a>
                <a href="../../tools.html" class="active">Tools</a>
                <a href="../../contact.html">Contact</a>
                <a href="../assistant.html">AI</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    ☾
                </button>
            </nav>

        </div>

    </header>

    <main class="tool-page">

        <div class="tool-body">

            <a href="../../tools.html" class="tool-back">
                ← $ cd ../tools
            </a>

            <div class="tool-panel">

                <div class="tool-titlebar">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green-dot"></span>
                    <span class="terminal-title">function-plotter — kaushix tools</span>
                </div>

                <div class="tool-form">

                    <label for="fn-input">y = f(x)</label>

                    <input
                        id="fn-input"
                        type="text"
                        placeholder="sin(x)"
                        value="sin(x)"
                        autocomplete="off"
                        spellcheck="false"
                    >

                    <p class="hint">
                        Use x, + − * / ^ ( ) pi e sin cos tan log ln exp sqrt abs.
                        Scroll to zoom, drag to pan.
                    </p>

                </div>

                <div class="tool-actions">

                    <button id="btn-plot" class="tool-btn" type="button">
                        $ plot
                    </button>

                    <button id="btn-reset" class="tool-btn ghost" type="button">
                        reset view
                    </button>

                </div>

                <div class="plot-canvas-wrap">

                    <canvas id="plot-canvas"></canvas>

                    <div class="plot-readout">
                        <span id="plot-fn">y = sin(x)</span>
                        <span id="plot-cursor">—</span>
                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Theme toggle -->

    <script>
        (function () {

            const toggle = document.getElementById("theme-toggle");

            const setTheme = (theme) => {

                document.documentElement.setAttribute("data-theme", theme);
                localStorage.setItem("theme", theme);

                if (toggle) {
                    toggle.textContent = theme === "dark" ? "☀" : "☾";
                }

            };

            if (toggle) {

                toggle.addEventListener("click", () => {

                    const current = document.documentElement.getAttribute("data-theme");

                    setTheme(current === "dark" ? "light" : "dark");

                });

            }

        })();
    </script>

    <script>
        /* ==========================================
           FUNCTION PLOTTER — Kaushix Labs Tools
        ========================================== */

        const ALLOWED_FUNCS = new Set([
            "x", "pi", "e", "sin", "cos", "tan",
            "log", "ln", "exp", "sqrt", "abs"
        ]);

        const input = document.getElementById("fn-input");
        const canvas = document.getElementById("plot-canvas");
        const ctx = canvas.getContext("2d");
        const fnLabel = document.getElementById("plot-fn");
        const cursorLabel = document.getElementById("plot-cursor");
        const btnPlot = document.getElementById("btn-plot");
        const btnReset = document.getElementById("btn-reset");

        let W = 0, H = 0;
        let cx = 0, cy = 0;      // world coords at canvas center
        let scale = 55;          // pixels per world unit
        let currentFn = null;

        /* ---------- parsing ---------- */

        function normalize(s) {
            s = s.trim();
            if (!s) throw new Error("Enter a function.");
            s = s.replace(/\s+/g, "").replace(/\^/g, "**");
            s = s.replace(/(\d)([a-zA-Z(])/g, "$1*$2");
            s = s.replace(/\)([a-zA-Z(])/g, ")*$1");
            s = s.replace(/\)(\d)/g, ")*$1");
            return s;
        }

        function validate(expr) {
            if (!/^[0-9a-z+\-*/^().\s]*$/.test(expr)) {
                throw new Error("Unsupported characters.");
            }
            for (const t of expr.split(/[^a-z]+/).filter(Boolean)) {
                if (!ALLOWED_FUNCS.has(t)) {
                    throw new Error("Unknown symbol '" + t + "'.");
                }
            }
            let depth = 0;
            for (const ch of expr) {
                if (ch === "(") depth++;
                if (ch === ")") depth--;
                if (depth < 0) throw new Error("Unbalanced parentheses.");
            }
            if (depth !== 0) throw new Error("Unbalanced parentheses.");
        }

        function compileMath(expr) {
            const map = {
                "pi": "Math.PI", "e": "Math.E", "sin": "Math.sin",
                "cos": "Math.cos", "tan": "Math.tan", "log": "Math.log",
                "ln": "Math.log", "exp": "Math.exp", "sqrt": "Math.sqrt",
                "abs": "Math.abs"
            };
            return expr.replace(/[a-z]+/g, (w) => map[w] || w);
        }

        function compile(expr) {
            const norm = normalize(expr);
            validate(norm);
            return new Function("x", "\"use strict\"; return (" + compileMath(norm) + ");");
        }

        /* ---------- view mapping ---------- */

        function worldToScreen(x, y) {
            return [(x - cx) * scale + W / 2, H / 2 - (y - cy) * scale];
        }

        function screenToWorld(px, py) {
            return [(px - W / 2) / scale + cx, (H / 2 - py) / scale + cy];
        }

        function niceStep(target) {
            const mag = Math.pow(10, Math.floor(Math.log10(target)));
            const norm = target / mag;
            let step;
            if (norm < 1.5) step = 1;
            else if (norm < 3.5) step = 2;
            else if (norm < 7.5) step = 5;
            else step = 10;
            return step * mag;
        }

        function fmt(v) {
            if (v === 0) return "0";
            const a = Math.abs(v);
            if (a >= 1e6 || a < 1e-4) return v.toExponential(2);
            return String(parseFloat(v.toFixed(4)));
        }

        function safeF(x) {
            try {
                const v = currentFn(x);
                return Number.isFinite(v) ? v : null;
            } catch (e) {
                return null;
            }
        }

        /* ---------- rendering ---------- */

        function resize() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            W = rect.width;
            H = rect.height;
            draw();
        }

        function draw() {
            if (!W || !H) return;

            ctx.clearRect(0, 0, W, H);

            const theme = document.documentElement.getAttribute("data-theme") || "dark";
            const gridColor = theme === "dark" ? "rgba(255,255,255,.06)" : "rgba(0,0,0,.08)";
            const axisColor = theme === "dark" ? "rgba(255,255,255,.35)" : "rgba(0,0,0,.35)";
            const textColor = theme === "dark" ? "#8b949e" : "#57606a";
            const curveColor = "#3fb950";

            const xmin = screenToWorld(0, 0)[0];
            const xmax = screenToWorld(W, 0)[0];
            const ymin = screenToWorld(0, H)[1];
            const ymax = screenToWorld(0, 0)[1];

            const stepX = niceStep(50 / scale);
            const stepY = niceStep(50 / scale);

            ctx.font = "10px JetBrains Mono, monospace";
            ctx.lineWidth = 1;

            // vertical gridlines
            ctx.strokeStyle = gridColor;
            ctx.fillStyle = textColor;
            ctx.textAlign = "center";
            for (let x = Math.ceil(xmin / stepX) * stepX; x <= xmax; x += stepX) {
                const [sx] = worldToScreen(x, 0);
                if (sx < 0 || sx > W) continue;
                ctx.beginPath();
                ctx.moveTo(sx, 0);
                ctx.lineTo(sx, H);
                ctx.stroke();
                ctx.fillText(fmt(x), sx, H - 4);
            }

            // horizontal gridlines
            ctx.textAlign = "right";
            for (let y = Math.ceil(ymin / stepY) * stepY; y <= ymax; y += stepY) {
                const [, sy] = worldToScreen(0, y);
                if (sy < 0 || sy > H) continue;
                ctx.beginPath();
                ctx.moveTo(0, sy);
                ctx.lineTo(W, sy);
                ctx.stroke();
                ctx.fillText(fmt(y), 22, sy + 4);
            }

            // axes
            const [ox, oy] = worldToScreen(0, 0);
            ctx.strokeStyle = axisColor;
            ctx.lineWidth = 1.5;
            if (ox >= 0 && ox <= W) {
                ctx.beginPath();
                ctx.moveTo(ox, 0);
                ctx.lineTo(ox, H);
                ctx.stroke();
            }
            if (oy >= 0 && oy <= H) {
                ctx.beginPath();
                ctx.moveTo(0, oy);
                ctx.lineTo(W, oy);
                ctx.stroke();
            }

            // curve
            if (currentFn) {
                ctx.strokeStyle = curveColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                let pen = false;
                const dx = 1 / scale;
                let prevY = null;
                for (let px = 0; px <= W; px += 1) {
                    const x = screenToWorld(px, 0)[0];
                    const y = safeF(x);
                    const [, sy] = worldToScreen(x, y === null ? 0 : y);
                    const off = y !== null && (y < ymin - (ymax - ymin) * 2 || y > ymax + (ymax - ymin) * 2);
                    if (y === null || off || (prevY !== null && y !== null && Math.abs(y - prevY) > (ymax - ymin) * 4)) {
                        pen = false;
                    } else {
                        if (!pen) {
                            ctx.moveTo(px, sy);
                            pen = true;
                        } else {
                            ctx.lineTo(px, sy);
                        }
                    }
                    prevY = y;
                    void dx;
                }
                ctx.stroke();
            }
        }

        /* ---------- interaction ---------- */

        const pointers = new Map();

        function pointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                px: e.clientX - rect.left,
                py: e.clientY - rect.top,
                id: e.pointerId
            };
        }

        canvas.addEventListener("pointerdown", (e) => {
            canvas.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, pointerPos(e));
        });

        canvas.addEventListener("pointermove", (e) => {
            const pos = pointerPos(e);

            if (pointers.has(e.pointerId)) {
                const prev = pointers.get(e.pointerId);
                const distPrev = distance(pointers);
                const distNow = distance(pointers, e.pointerId, pos);

                if (pointers.size >= 2 && distPrev > 0 && distNow > 0) {
                    const factor = distNow / distPrev;
                    const midPrev = midpoint(pointers);
                    const midNow = e.pointerId
                        ? midpointWith(pointers, e.pointerId, pos)
                        : midPrev;
                    zoomAt(factor, midNow.px, midNow.py);
                } else if (pointers.size === 1) {
                    pan(prev.px - pos.px, prev.py - pos.py);
                }

                pointers.set(e.pointerId, pos);
            }

            if (currentFn) {
                const [wx, wy] = screenToWorld(pos.px, pos.py);
                const y = safeF(wx);
                cursorLabel.textContent = "x = " + fmt(wx) +
                    (y === null ? " · y = —" : " · y = " + fmt(y)) +
                    (y === null ? "" : " · f(x) = " + fmt(y));
            }
        });

        canvas.addEventListener("pointerup", (e) => pointers.delete(e.pointerId));
        canvas.addEventListener("pointercancel", (e) => pointers.delete(e.pointerId));

        function distance(map, addId, addPos) {
            const pts = [...map.values()];
            if (addId && addPos) {
                const others = pts.filter(p => p.id !== addId);
                return Math.hypot(others[0].px - addPos.px, others[0].py - addPos.py);
            }
            if (pts.length < 2) return 0;
            return Math.hypot(pts[0].px - pts[1].px, pts[0].py - pts[1].py);
        }

        function midpoint(map) {
            const pts = [...map.values()];
            return {
                px: (pts[0].px + pts[1].px) / 2,
                py: (pts[0].py + pts[1].py) / 2
            };
        }

        function midpointWith(map, addId, addPos) {
            const others = [...map.values()].filter(p => p.id !== addId);
            return {
                px: (others[0].px + addPos.px) / 2,
                py: (others[0].py + addPos.py) / 2
            };
        }

        function pan(dx, dy) {
            cx -= dx / scale;
            cy += dy / scale;
            draw();
        }

        function zoomAt(factor, mx, my) {
            const [wx, wy] = screenToWorld(mx, my);
            scale = Math.min(2e6, Math.max(1e-5, scale * factor));
            cx = wx - (mx - W / 2) / scale;
            cy = wy - (H / 2 - my) / scale;
            draw();
        }

        canvas.addEventListener("wheel", (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, mx, my);
        }, { passive: false });

        canvas.addEventListener("mousemove", (e) => {
            if (!pointers.size && currentFn) {
                const rect = canvas.getBoundingClientRect();
                const [wx, wy] = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
                const y = safeF(wx);
                cursorLabel.textContent = "x = " + fmt(wx) + (y === null ? " · y = —" : " · y = " + fmt(y));
            }
        });

        canvas.addEventListener("mouseleave", () => {
            cursorLabel.textContent = "—";
        });

        /* ---------- actions ---------- */

        function runPlot() {
            const raw = input.value.trim();
            if (!raw) {
                input.focus();
                return;
            }
            try {
                currentFn = compile(raw);
                fnLabel.textContent = "y = " + raw;
                draw();
            } catch (e) {
                cursorLabel.textContent = "! " + e.message;
            }
        }

        function resetView() {
            cx = 0;
            cy = 0;
            scale = 55;
            draw();
        }

        btnPlot.addEventListener("click", runPlot);
        btnReset.addEventListener("click", resetView);

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                runPlot();
            }
        });

        window.addEventListener("resize", resize);

        // replot when theme toggles (colors change)
        const observer = new MutationObserver(() => draw());
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

        // initial render
        resize();
        runPlot();
    </script>

</body>

</html>
